name: Bench comment

# Posts the Bench workflow's harness reports on the pull request. It runs in the base
# repository's context with permission to comment, so it never checks out or runs the pull
# request's code: it only reads the reports artifact, and treats everything in it as untrusted
# text (the PR number is checked against the run's head commit; reports go inside a code block).

on:
  workflow_run:
    workflows: [Bench]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Download the reports
        uses: actions/download-artifact@v4
        with:
          name: bench-reports
          path: reports
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Comment the verdicts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_HEAD: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -eu
          pr=$(tr -cd '0-9' < reports/pr.txt | head -c 10)
          [ -n "$pr" ] || { echo "no PR number"; exit 0; }
          head=$(gh api "repos/$REPO/pulls/$pr" --jq .head.sha)
          [ "$head" = "$RUN_HEAD" ] || { echo "PR $pr head $head is not this run's $RUN_HEAD: not commenting"; exit 0; }
          {
            echo "<!-- argus-bench -->"
            echo "### ARGUS-BENCH: native harness"
            echo
            if [ -s reports/verdicts.txt ]; then
              while read -r name ext verdict; do
                name=$(printf '%s' "$name" | tr -cd 'A-Za-z0-9_')
                ext=$(printf '%s' "$ext" | tr -cd 'a-z')
                verdict=$(printf '%s' "$verdict" | tr -cd 'A-Z')
                [ -n "$name" ] || continue
                if [ "$verdict" = LINK ]; then echo "**\`$name.$ext\`**"; else echo "**\`$name.$ext\`: $verdict**"; fi
                echo
                # The links come from the pull request's run: only the site's own link shape is
                # posted (https, this site, a base64url fragment, a plain name), and only if it
                # fits a comment (65,536 characters); otherwise make share gives it locally.
                if [ -f "reports/$name.links.txt" ]; then
                  home=$(sed -n 1p "reports/$name.links.txt"); bench=$(sed -n 2p "reports/$name.links.txt")
                  ok='^https://gke0op\.github\.io/argus/(bench/)?#(zig|wgsl)=[A-Za-z0-9_-]+&name=[A-Za-z0-9_]+$'
                  if ! printf '%s' "$home" | grep -Eq "$ok" || ! printf '%s' "$bench" | grep -Eq "$ok"; then
                    echo "No link: the run's links did not have the site's link shape."
                  elif [ ${#home} -gt 20000 ]; then
                    echo "Too large for a link in a comment: \`make share THEME=...\` prints it."
                  else
                    echo "[Run it on the home page]($home) · [Grade it on the bench]($bench) (the source rides in the link; nothing is uploaded)"
                  fi
                  echo
                fi
                [ -f "reports/$name.nolink.txt" ] && { tr -d '`[]()<>' < "reports/$name.nolink.txt" | head -c 400; echo; echo; }
                echo '```text'
                tr -d '`' < "reports/$name.txt" | head -c 6000
                echo '```'
                echo
              done < reports/verdicts.txt
              echo "Once merged, these themes join the home page's picker: <https://gke0op.github.io/argus/>."
              echo
            else
              echo "No theme was graded (run: $CONCLUSION)."
            fi
            [ -s reports/skipped.txt ] && { tr -d '`' < reports/skipped.txt; echo; }
            echo "Run on a GitHub-hosted Apple silicon runner (\`macos-15\`), shared and virtualized: Gate 8's frame time there is not the M3 of the leaderboard. [The run]($RUN_URL)."
          } > body.md
          old=$(gh api "repos/$REPO/issues/$pr/comments" --paginate --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- argus-bench -->"))) | .id' | tail -1)
          if [ -n "$old" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$old" -F body=@body.md > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$pr/comments" -F body=@body.md > /dev/null
          fi
