name: Bench feed

# The live board's feed (the bench page's "Submissions, live"): bench/feed.sh reads the pull
# requests that add themes under bench/submissions/, their files and their bench comments, and
# bench/feed.zig writes feed.json, published as the only file on the `bench-feed` branch (the
# page reads it from raw.githubusercontent.com).
#
# pull_request_target runs in the base repository with a write token, so this job never checks
# out or runs a pull request's code: it checks out this repository's default branch for the tool
# and only reads metadata through the API. Everything it reads is treated as untrusted text
# (bench/feed.zig checks every name, SHA and repository against its shape).

on:
  pull_request_target:
    types: [opened, reopened, synchronize, closed, edited]
    paths:
      - 'bench/submissions/**.zig'
  workflow_run:
    workflows: [Bench comment]
    types: [completed]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: bench-feed
  cancel-in-progress: true

jobs:
  feed:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Cache Zig 0.17.0
        uses: actions/cache@v4
        with:
          path: .toolchain
          key: zig-0.17.0-x86_64-linux-${{ hashFiles('tools/get-zig.sh') }}

      - name: Install the pinned Zig (tools/get-zig.sh, SHA-256 checked)
        run: tools/get-zig.sh

      - name: Build the feed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bench/feed.sh "$RUNNER_TEMP/feed"

      - name: Publish it on the bench-feed branch
        env:
          FEED: ${{ runner.temp }}/feed/feed.json
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan bench-feed-new
          git rm -rq --cached . 2>/dev/null || true
          cp "$FEED" feed.json
          git add feed.json
          git commit -qm "bench feed: $(jq -r '.generated' feed.json), $(jq '.entries | length' feed.json) entries"
          git push -qf origin bench-feed-new:bench-feed
