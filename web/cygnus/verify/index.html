<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cygnus A · verify</title>
<style>
  body { background: #111; color: #ccd; font: 13px/1.5 ui-monospace, Menlo, monospace; margin: 16px; }
  pre { white-space: pre-wrap; }
  canvas { max-width: 100%; border: 1px solid #333; }
</style>
</head>
<body>
<pre id="log">running…</pre>
<canvas id="c" width="16" height="16"></canvas>
<script type="module">
// Verification against the app (run with web/cygnus/verify/serve.zig, which takes the PUTs):
//   ?size=1920x1080&skip=300&fps=60   trace at that size, step the theme as the offline renderer's
//                                     --skip/--fps, shade the frame (sRGB 8-bit), upload it to
//                                     verify/out/web_WxH.rgba and diff it against out/app_WxH.rgba
//                                     (src/offline_render_bh.zig, same flags)
//   &contour=1                        the shadow-edge sweep against Bardeen's curve (gpu_bench's)
//   &frames=600                       per-frame GPU time of the canvas shade over that many frames
import { create } from '../cygnus.js';
const q = new URLSearchParams(location.search);
const [W, H] = (q.get('size') ?? '1920x1080').split('x').map(Number);
const skip = +(q.get('skip') ?? 300);
const fps = +(q.get('fps') ?? 60);
const log = document.getElementById('log');
const out = [];
const say = (s) => { out.push(s); log.textContent = out.join('\n'); };
const canvas = document.getElementById('c');
canvas.width = W;
canvas.height = H;
const result = { size: [W, H], skip, fps };
window.result = result;
try {
  const e = await create(canvas, { noTrace: true });
  window.cygnus = e;
  e.verify.step(skip, (0.008 * 30) / fps);
  const t0 = performance.now();
  // &texpo=1 traces as src/offline_render_bh.zig does (TraceParams.exposure 1 during the trace).
  await e.verify.trace(W, H, q.has('expo') ? +q.get('expo') : undefined, q.has('texpo') ? +q.get('texpo') : undefined);
  const s = e.stats();
  result.traceWallMs = performance.now() - t0;
  result.traceGpuMs = s.traceGpuMs;
  result.traceTiles = s.traceTiles;
  result.exposure = s.exposure;
  say(`trace ${W}x${H}: ${(result.traceWallMs / 1000).toFixed(3)} s wall (incl. meter), ${s.traceGpuMs == null ? '–' : (s.traceGpuMs / 1000).toFixed(3)} s GPU, ${s.traceTiles} tiles, exposure ${s.exposure.toFixed(4)}, t ${s.simTimeM.toFixed(3)} M`);
  const px = await e.verify.readRGBA();
  await fetch(`out/web_${W}x${H}.rgba`, { method: 'PUT', body: px });
  const ref = await fetch(`out/app_${W}x${H}.rgba`);
  if (ref.ok) {
    const a = new Uint8Array(await ref.arrayBuffer());
    const n = W * H;
    let exact = 0, within1 = 0, within8 = 0, maxd = 0, sum = 0, worst = -1;
    const hist = new Array(9).fill(0);
    const diff = new Uint8Array(n * 4);
    for (let i = 0; i < n; i++) {
      let m = 0;
      for (let c = 0; c < 3; c++) {
        const d = Math.abs(px[4 * i + c] - a[4 * i + c]);
        sum += d;
        if (d > m) m = d;
      }
      if (m === 0) exact++;
      if (m <= 1) within1++;
      if (m <= 8) within8++;
      if (m > maxd) { maxd = m; worst = i; }
      hist[Math.min(8, Math.ceil(Math.log2(m + 1)))]++;
      const v = Math.min(255, m * 32);
      diff[4 * i] = v; diff[4 * i + 1] = v; diff[4 * i + 2] = v; diff[4 * i + 3] = 255;
    }
    await fetch(`out/diff_${W}x${H}.rgba`, { method: 'PUT', body: diff });
    Object.assign(result, {
      pixels: n, exactPct: (100 * exact) / n, within1Pct: (100 * within1) / n, within8Pct: (100 * within8) / n,
      maxLevel: maxd, worstAt: [worst % W, Math.floor(worst / W)], meanAbsLevel: sum / (3 * n),
      maxDiffHistLog2: hist,
    });
    say(`vs app (offline_render_bh, same flags): ${result.exactPct.toFixed(4)}% pixels identical, ${result.within1Pct.toFixed(4)}% within 1 level, ${result.within8Pct.toFixed(4)}% within 8, max ${maxd} levels at (${result.worstAt}), mean |d| ${result.meanAbsLevel.toExponential(3)} levels/channel`);
    say(`  max-channel diff histogram [0, 1, 2-3, 4-7, 8-15, 16-31, 32-63, 64-127, 128+]: ${hist.join(' ')}`);
  } else say(`no out/app_${W}x${H}.rgba to compare against`);
  if (q.get('contour') === '1') {
    const c = await e.verify.contour();
    result.contour = { ...c, offsets: undefined };
    say(`shadow contour (WGSL f32 probe): ${c.points} points, ${c.iters} bisections: max ${c.max.toExponential(2)} M (off-axis ${c.maxOffAxis.toExponential(2)}, polar band ${c.maxPolar.toExponential(2)}), rms ${c.rms.toExponential(2)} M (off-axis ${c.rmsOffAxis.toExponential(2)}), ${c.bracketFailures} bracket failures`);
    await fetch('out/contour_offsets.f64', { method: 'PUT', body: c.offsets });
  }
  const frames = +(q.get('frames') ?? 0);
  if (frames > 0) {
    let last = performance.now();
    let k = 0;
    const t1 = performance.now();
    await new Promise((res) => {
      const tick = (now) => {
        e.frame(now / 1000, (now - last) / 1000);
        last = now;
        if (++k < frames) requestAnimationFrame(tick); else res();
      };
      requestAnimationFrame(tick);
    });
    await new Promise((r) => setTimeout(r, 300));
    const st = e.stats();
    result.shadeGpuMs = st.gpuMs;
    result.shadeCpuMs = st.cpuMs;
    result.fps = frames / ((performance.now() - t1 - 300) / 1000);
    say(`shade ${W}x${H}: GPU ${st.gpuMs?.toFixed(3)} ms/frame (mean of last 120), CPU ${st.cpuMs?.toFixed(3)} ms/frame, ${result.fps.toFixed(1)} fps over ${frames} frames`);
  }
  result.done = true;
} catch (err) {
  say('ERROR ' + (err?.stack ?? err));
  result.error = String(err);
}
</script>
</body>
</html>
